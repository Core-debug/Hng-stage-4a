<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Summarizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-50">
    <div class="p-4 w-80">
        <div class="flex flex-row justify-between items-center mb-2">
            <h5 class="text-lg font-bold text-gray-800">AI Summarizer</h5>
            <button id="resetBtn"
                class="text-xs text-red-500 hover:text-red-700 font-medium p-1 bg-red-50 rounded-lg">Clear</button>
        </div>

        <div id="pageTitle" class="text-xs text-gray-500 truncate mb-3 italic"></div>

        <div class="mb-3">
            <input type="text" id="apiKeyInput" placeholder="Paste Groq API Key"
                class="w-full p-2 text-xs border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <button id="summarizeBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg flex justify-center items-center gap-2 transition shadow-sm">
            <span id="btnText">Summarize Page</span>
            <span id="spinner" class="hidden animate-spin">⏳</span>
        </button>

        <div id="outputContainer" class="mt-4 p-3 bg-white border border-gray-200 rounded-lg shadow-inner">
            <h6 class="text-xs font-bold uppercase text-gray-400 mb-2">Summary:</h6>
            <div id="summaryResult" class="text-sm text-gray-700 leading-relaxed whitespace-pre-line"></div>
            <hr class="my-3 border-gray-100">
            <div id="readingTime" class="text-xs text-gray-500 italic"></div>
        </div>

        <div id="errorMessage" class="text-xs text-red-600 mt-2 hidden text-center italic"></div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
